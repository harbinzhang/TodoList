skills:
  - name: feature
    path: skills/feature/SKILL.md
    description: Manage a short-lived feature branch and worktree using profile-driven branch, review, verify, PR, and cleanup defaults
    adapters:
      claude: adapters/claude/commands/feature.md
  - name: re
    path: skills/re/SKILL.md
    description: Review current-worktree git changes against the branch upstream or profile fallback bases
    adapters:
      claude: adapters/claude/commands/re.md
  - name: rebase
    path: skills/rebase/SKILL.md
    description: Recreate the current worktree on a fresh branch reset to its upstream or a named remote branch while discarding tracked and normal untracked local changes
    adapters:
      claude: adapters/claude/commands/rebase.md
  - name: tdd
    path: skills/tdd/SKILL.md
    description: Drive feature work or bug fixes through red-green-refactor with repo-profile test commands
    adapters:
      claude: adapters/claude/commands/tdd.md
  - name: verify
    path: skills/verify/SKILL.md
    description: Run the repository's canonical verification command set from repo-profile.yaml
    adapters:
      claude: adapters/claude/commands/verify.md
  - name: pr-coding-loop
    path: skills/pr-coding-loop/SKILL.md
    description: Create and maintain implementation PRs from coding-agent worktrees using upstream-derived PR bases and the shared PR agent marker protocol
    adapters:
      claude: adapters/claude/commands/pr-coding-loop.md
  - name: pr-review-loop
    path: skills/pr-review-loop/SKILL.md
    description: Review PRs using a bounded interval-based PR agent marker loop, Chinese human summaries, and SHA-bound approval markers
    adapters:
      claude: adapters/claude/commands/pr-review-loop.md
  - name: pcl
    path: skills/pcl/SKILL.md
    description: Alias for pr-coding-loop
    adapters:
      claude: adapters/claude/commands/pcl.md
  - name: prl
    path: skills/prl/SKILL.md
    description: Alias for pr-review-loop
    adapters:
      claude: adapters/claude/commands/prl.md
  - name: reviewl
    path: skills/reviewl/SKILL.md
    description: Alias for pr-review-loop, matching review-loop slash-command search terms
    adapters:
      claude: adapters/claude/commands/reviewl.md
  - name: adversarial-review
    path: skills/adversarial-review/SKILL.md
    description: Independently challenge an exact code change for evidence-backed merge blockers without modifying it
    adapters:
      claude: adapters/claude/commands/adversarial-review.md
  - name: codex-relay
    path: skills/codex-relay/SKILL.md
    description: Plan a change, confirm the plan with the user, delegate each task to Codex with checkpoint commits, and finish with dual adversarial review
    adapters:
      claude: adapters/claude/commands/codex-relay.md
  - name: cr
    path: skills/cr/SKILL.md
    description: Alias for codex-relay
    adapters:
      claude: adapters/claude/commands/cr.md
  - name: pr-adversarial-loop
    path: skills/pr-adversarial-loop/SKILL.md
    description: Carry an implementation branch or existing PR through independent adversarial review, fixes, full verification, and merge
    adapters:
      claude: adapters/claude/commands/pr-adversarial-loop.md
  - name: pal
    path: skills/pal/SKILL.md
    description: Alias for pr-adversarial-loop
    adapters:
      claude: adapters/claude/commands/pal.md
  - name: pr-retro-audit
    path: skills/pr-retro-audit/SKILL.md
    description: Audit recent, open, merged, or closed PRs for missed critical issues and review-quality gaps
    adapters:
      claude: adapters/claude/commands/pr-retro-audit.md
  - name: upstream-from-repo
    path: skills/upstream-from-repo/SKILL.md
    description: Upstream reusable skill or workflow behavior from a consumer repo into Agent Workflow Kit without modifying the source repo
    adapters:
      claude: adapters/claude/commands/upstream-from-repo.md
  - name: consumer-onboarding
    path: skills/consumer-onboarding/SKILL.md
    description: Onboard a new consumer repo to vendored Agent Workflow Kit skills, catalog routing, and repo-profile defaults
    adapters:
      claude: adapters/claude/commands/consumer-onboarding.md
  - name: upstream-and-broadcast
    path: skills/upstream-and-broadcast/SKILL.md
    description: Upstream reusable behavior from a consumer repo into AWK, then broadcast the committed AWK ref to registered consumers
    adapters:
      claude: adapters/claude/commands/upstream-and-broadcast.md
  - name: gha-monitor
    path: skills/gha-monitor/SKILL.md
    description: Check recent GitHub Actions workflow runs and classify failures or anomalies
  - name: test-quality-audit
    path: skills/test-quality-audit/SKILL.md
    description: Assess whether tests provide real behavioral confidence rather than only file-count coverage
  - name: add-high-quality-tests
    path: skills/add-high-quality-tests/SKILL.md
    description: Add or strengthen tests that catch named regressions and prove their effectiveness
    adapters:
      claude: adapters/claude/commands/add-high-quality-tests.md
  - name: roadmap
    path: skills/roadmap/SKILL.md
    description: Operate an in-repository epic roadmap with explicit source-of-truth, approval, drift, and mission-linkage rules
    adapters:
      claude: adapters/claude/commands/roadmap.md
  - name: cc
    path: skills/cc/SKILL.md
    description: Run compact native Codex collaboration from a user-confirmed task manifest
    adapters:
      claude: adapters/claude/commands/cc.md
  - name: crc
    path: skills/crc/SKILL.md
    description: Run compact Codex Relay planning and execution from a user-confirmed task manifest
    adapters:
      claude: adapters/claude/commands/crc.md
  - name: mcc
    path: skills/mcc/SKILL.md
    description: Alias for multi-cc
    adapters:
      claude: adapters/claude/commands/mcc.md
  - name: multi-cc
    path: skills/multi-cc/SKILL.md
    description: Plan and finish one outcome through sequential independently mergeable Codex collaboration PRs
    adapters:
      claude: adapters/claude/commands/multi-cc.md
  - name: pall
    path: skills/pall/SKILL.md
    description: Carry a PR through event-driven adversarial review, risk-tiered exact-head verification, approval, and guarded merge
    adapters:
      claude: adapters/claude/commands/pall.md
  - name: firebase-functions-best-practices
    path: skills/firebase-functions-best-practices/SKILL.md
    description: Audit, design, implement, or refactor Firebase Functions with evidence-driven correctness, security, performance, and cost guidance
    adapters:
      claude: adapters/claude/commands/firebase-functions-best-practices.md
  - name: prepare-agent-handoff
    path: skills/prepare-agent-handoff/SKILL.md
    description: Compress confirmed context into one authorization-preserving prompt for a downstream agent
    adapters:
      claude: adapters/claude/commands/prepare-agent-handoff.md
  - name: stale-client-handling
    path: skills/stale-client-handling/SKILL.md
    description: Investigate and safely mitigate suspected writes from outdated application clients using repository-provided hooks
    adapters:
      claude: adapters/claude/commands/stale-client-handling.md

